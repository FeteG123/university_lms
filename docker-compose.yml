services:
  traefik:
    image: traefik:v3.2
    container_name: lms-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
    command:
      - --configFile=/etc/traefik/traefik.yml
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms}
      POSTGRES_DB: ${POSTGRES_DB:-lms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lms-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: lms-migrate
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://lms:lms@postgres:5432/lms}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api-1:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: lms-api-1
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://lms:lms@postgres:5432/lms}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      WORKER_ID: "1"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-long-random-string}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      API_INSTANCE: api-1
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-lms-api}
      SUBMISSION_STORAGE_PATH: ${SUBMISSION_STORAGE_PATH:-/data/submissions}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./services/api/app:/app/app:ro
      - submission_data:/data/submissions
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  api-2:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: lms-api-2
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://lms:lms@postgres:5432/lms}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      WORKER_ID: "2"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-long-random-string}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      API_INSTANCE: api-2
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-lms-api}
      SUBMISSION_STORAGE_PATH: ${SUBMISSION_STORAGE_PATH:-/data/submissions}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./services/api/app:/app/app:ro
      - submission_data:/data/submissions
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: lms-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_worker:celery_app", "worker", "--loglevel=INFO"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://lms:lms@postgres:5432/lms}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      API_INSTANCE: celery-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-lms-api}
      SUBMISSION_STORAGE_PATH: ${SUBMISSION_STORAGE_PATH:-/data/submissions}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - submission_data:/data/submissions

  # --- R12: Grafana LGTM + OpenTelemetry (optional profile) ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: lms-otel-collector
    profiles: [observability]
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./infra/otel/otel-collector.yaml:/etc/otel-collector.yaml:ro
    depends_on:
      tempo:
        condition: service_started
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"

  tempo:
    image: grafana/tempo:2.3.1
    container_name: lms-tempo
    profiles: [observability]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo

  loki:
    image: grafana/loki:2.9.4
    container_name: lms-loki
    profiles: [observability]
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:2.9.4
    container_name: lms-promtail
    profiles: [observability]
    volumes:
      - ./infra/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["-config.file=/etc/promtail/config.yml"]
    depends_on:
      loki:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: lms-prometheus
    profiles: [observability]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.3.3
    container_name: lms-grafana
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  postgres_data:
  redis_data:
  submission_data:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
