global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: lms-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-1:8000
          - api-2:8000
        labels:
          app: lms-api
